name: PR Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
      - name: Run tests
        run: "make test"
